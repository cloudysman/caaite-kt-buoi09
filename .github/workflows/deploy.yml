name: deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dong goi anh
        run: docker build -t app:${{ github.sha }} .

      - name: Trien khai len may chu
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Kho mau chua khai bao secret DEPLOY_HOST, bo qua buoc trien khai that"
          else
            echo "Trien khai len $DEPLOY_HOST"
          fi
